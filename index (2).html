<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>推しグッズ管理</title>
<style>
:root{--bg:#fff1f5;--card:#fff;--tx:#5a3d4a;--sub:#a58a96;--pk:#ee6a99;--pk2:#fde1ea;--ln:#f8d3df;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241a1f;--card:#33252c;--tx:#f6e3ea;--sub:#b99aa8;--pk:#f48fb1;--pk2:#4a2f3a;--ln:#4a3641;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#241a1f;--card:#33252c;--tx:#f6e3ea;--sub:#b99aa8;--pk:#f48fb1;--pk2:#4a2f3a;--ln:#4a3641;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:22px;margin:4px 0 2px;color:var(--pk)}h2{font-size:16px;margin:22px 0 10px}
p{margin:0}.sub{color:var(--sub);font-size:13px}
button,.btn{font:inherit;border:0;cursor:pointer;color:inherit}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.st div{background:var(--card);border-radius:16px;padding:12px 10px;box-shadow:0 2px 10px rgba(238,106,153,.12)}
.st small{display:block;font-size:11px;color:var(--sub)}.st b{font-size:26px}.st u{text-decoration:none;font-size:12px;margin-left:2px}
.cam{width:100%;display:flex;align-items:center;gap:14px;text-align:left;background:var(--pk2);border:1px solid var(--ln);border-radius:20px;padding:16px}
.cam i{flex:none;width:64px;height:64px;border-radius:50%;background:var(--pk);display:grid;place-items:center;font-size:28px;font-style:normal}
.cam b{display:block;font-size:18px;color:var(--pk)}.cam span{font-size:12px;color:var(--sub)}
.qm{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qm button{background:var(--card);border-radius:16px;padding:12px 4px;font-size:12px;display:flex;flex-direction:column;gap:4px;align-items:center;box-shadow:0 2px 10px rgba(238,106,153,.12)}
.qm em{font-style:normal;font-size:24px}
.row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}.row .gc{flex:none;width:140px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gc{background:var(--card);border-radius:16px;padding:8px;position:relative;display:flex;flex-direction:column;gap:3px;text-align:left;box-shadow:0 2px 10px rgba(238,106,153,.12)}
.ph{aspect-ratio:1;border-radius:12px;background:var(--pk2);display:grid;place-items:center;font-size:36px;overflow:hidden}.ph img{width:100%;height:100%;object-fit:cover}
.gc b{font-size:14px}.gc small{font-size:11px;color:var(--sub)}
.tag{align-self:flex-start;font-size:11px;background:var(--pk2);color:var(--pk);border-radius:99px;padding:2px 8px}
.q{position:absolute;top:12px;right:12px;font-style:normal;font-size:12px;background:var(--card);border-radius:99px;padding:1px 7px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:12px 0}
.chips button{flex:none;background:var(--card);border-radius:99px;padding:6px 14px;font-size:13px}.chips .on{background:var(--pk);color:#fff}
.empty{background:var(--card);border-radius:16px;padding:22px;text-align:center;color:var(--sub);font-size:14px;line-height:1.6}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--ln);display:flex;justify-content:space-around;align-items:flex-end;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:none;font-size:10px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:60px}
nav button em{font-style:normal;font-size:22px}nav .on{color:var(--pk);font-weight:700}
nav .fab{margin-top:-28px}nav .fab em{width:58px;height:58px;border-radius:50%;background:var(--pk);display:grid;place-items:center;box-shadow:0 4px 14px rgba(238,106,153,.5)}
#S{display:none;position:fixed;inset:0;background:rgba(40,20,30,.5);z-index:9;align-items:flex-end;justify-content:center}#S.on{display:flex}
.sh{background:var(--bg);width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.hd{text-align:right}.hd button{background:var(--card);border-radius:50%;width:34px;height:34px}
label.f{display:block;font-size:12px;color:var(--sub);margin:12px 0 4px}
input[type=text],input[type=number],input[type=search]{width:100%;font:inherit;padding:11px 12px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx)}
.btn,.pri{display:block;width:100%;text-align:center;background:var(--pk);color:#fff;border-radius:14px;padding:13px;margin-top:14px;font-weight:700}
.ghost{background:var(--card);color:var(--tx);font-weight:400}.danger{background:none;color:#d6456b;font-weight:400}
.pv{width:100%;aspect-ratio:1;border-radius:16px;object-fit:cover;background:var(--pk2);display:block}
.hit{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:8px;margin-top:8px;width:100%;text-align:left}
.hit img,.hit .ph{width:56px;height:56px;flex:none;border-radius:10px;font-size:22px}.hit b{display:block}.hit span{margin-left:auto;color:var(--pk);font-weight:700;font-size:18px}
.qt{display:flex;align-items:center;gap:14px;margin-top:10px}.qt button{width:38px;height:38px;border-radius:50%;background:var(--card);font-size:20px}
:focus-visible{outline:3px solid var(--pk);outline-offset:2px}
.rb{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(238,106,153,.12)}.rb small{color:var(--sub);font-size:13px}
.bk{background:none;color:var(--pk);padding:4px 0;font-size:14px}
.swg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.sw{background:var(--card);border-radius:16px;padding:16px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:12px;border:2px solid transparent}.sw.on{border-color:var(--pk)}
.sw i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:700}
.pri:disabled{opacity:.4;cursor:default}
.ld{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-content:center;justify-items:center;gap:14px;color:var(--pk);font-weight:700}
.sp{width:40px;height:40px;border-radius:50%;border:4px solid var(--pk2);border-top-color:var(--pk);animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sp{animation-duration:3s}}
body{background:var(--bg) linear-gradient(180deg,var(--bg2),var(--bg) 340px) no-repeat}
.st div,.qm button,.gc,.rb{box-shadow:0 2px 10px var(--sh)}
nav .fab em{box-shadow:0 4px 14px var(--sh)}
.btn:not(.ghost):not(.danger),.pri:not(.ghost):not(.danger),.chips .on,.sw i{color:var(--on)}
.swg{grid-template-columns:repeat(4,1fr);gap:8px}.sw{padding:12px 2px 8px;font-size:11px;gap:10px}.sw i{width:38px;height:38px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
h1,.cam b,.bk,.tag,.hit span,nav .on,.ld{color:var(--ac)}
.hdr{display:flex;justify-content:space-between;align-items:center}.bell{background:var(--card);border-radius:50%;width:40px;height:40px;font-size:20px;box-shadow:0 2px 10px var(--sh)}
.ic{flex:none;vertical-align:-4px}
.btn .ic,.pri .ic,.rb .ic{margin-right:6px}
.rb .ic{color:var(--ac)}
.cam i{color:var(--on)}
nav .fab em{color:var(--on)}
nav em .ic{display:block;margin:0}
.qm em{color:var(--ac);display:grid;place-items:center;height:26px}.qm .ic{margin:0}
.bell{color:var(--ac);display:grid;place-items:center}.bell .ic{margin:0}
.ph{color:var(--ac)}.ph .ic{opacity:.5}
.hd button{display:inline-grid;place-items:center;color:var(--sub)}.hd .ic{margin:0}
.sw i .ic{display:block;margin:0}
.rb b .ic{margin:0}
label.btn{position:relative;overflow:hidden}
label input[type=file]{display:block;position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;cursor:pointer}
#cam{position:fixed;inset:0;z-index:30;background:#000;color:#fff;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#fr{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);border:3px solid #fff;box-shadow:0 0 0 100vmax rgba(0,0,0,.5);pointer-events:none}
#fcap{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:13px;text-shadow:0 1px 4px #000;padding:0 12px;pointer-events:none}
.ctop{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;z-index:3}.ctop button{width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center}
.cbar{position:absolute;left:0;right:0;bottom:0;z-index:3;background:rgba(0,0,0,.6);padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px))}
.seg{display:flex;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.45)}
.seg button{flex:1;padding:11px 6px;background:transparent;color:#fff;font-size:13px}.seg button+button{border-left:1px solid rgba(255,255,255,.45)}.seg .on{background:var(--pk);color:var(--on)}
.gchips{display:flex;gap:6px;overflow-x:auto;margin-top:8px}.gchips button{flex:none;border-radius:99px;padding:6px 12px;font-size:12px;background:rgba(255,255,255,.2);color:#fff}.gchips .on{background:var(--pk);color:var(--on)}
.chint{font-size:12px;margin-top:8px;opacity:.9}
.shr{display:flex;align-items:center;margin-top:10px}.shr>*{flex:1}.sum{font-size:12px;opacity:.85}
.shut{flex:none!important;width:68px;height:68px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.45)}
#fr{border:2px solid rgba(255,255,255,.7);box-shadow:0 0 0 100vmax rgba(0,0,0,.22)}
.gq{margin-top:8px;background:rgba(255,255,255,.14)!important;border-color:rgba(255,255,255,.35)!important;color:#fff!important}.gq::placeholder{color:rgba(255,255,255,.65)}
.gl{margin-top:6px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.gr{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:14px;text-align:left}.gr small{font-size:11px;opacity:.8;flex:none}.gr.on{background:var(--pk);color:var(--on)}
</style></head><body>
<main id="m"></main>
<nav id="nav"></nav>
<div id="S" role="dialog" aria-modal="true"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db=null,items=[],view='home',flt='',tmp=null,armed=false;

/* ---- 保存(IndexedDB) ---- */
function openDB(){return new Promise((ok,ng)=>{try{const r=indexedDB.open('oshi',1);r.onupgradeneeded=()=>r.result.createObjectStore('g',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)}catch(e){ng(e)}})}
function put(i){try{db&&db.transaction('g','readwrite').objectStore('g').put(i)}catch(e){}}
function del(id){try{db&&db.transaction('g','readwrite').objectStore('g').delete(id)}catch(e){}}
function loadAll(){return new Promise(ok=>{try{const r=db.transaction('g').objectStore('g').getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>ok([])}catch(e){ok([])}})}

/* ---- 画像処理と簡易マッチング ---- */
async function proc(file){
  const url=URL.createObjectURL(file);
  const im=await new Promise((ok,ng)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ng;i.src=url});
  const W=im.naturalWidth,H=im.naturalHeight,s=Math.min(W,H);
  const c=document.createElement('canvas');c.width=c.height=360;
  c.getContext('2d').drawImage(im,(W-s)/2,(H-s)/2,s,s,0,0,360,360);
  URL.revokeObjectURL(url);
  const f=document.createElement('canvas');f.width=f.height=16;
  const x=f.getContext('2d');x.drawImage(c,0,0,16,16);
  const d=x.getImageData(0,0,16,16).data,g=[],h=new Array(64).fill(0);
  for(let i=0;i<d.length;i+=4){g.push(.3*d[i]+.59*d[i+1]+.11*d[i+2]);h[(d[i]>>6)*16+(d[i+1]>>6)*4+(d[i+2]>>6)]++}
  const mean=g.reduce((a,b)=>a+b)/g.length,sd=Math.sqrt(g.reduce((a,b)=>a+(b-mean)**2,0)/g.length)||1;
  return{img:c.toDataURL('image/jpeg',.8),feat:{g:g.map(v=>(v-mean)/sd),h:h.map(v=>v/256)}};
}
function sim(a,b){let dot=0,hi=0;for(let i=0;i<256;i++)dot+=a.g[i]*b.g[i];for(let i=0;i<64;i++)hi+=Math.min(a.h[i],b.h[i]);return .4*Math.max(0,dot/256)+.6*hi}

/* ---- 画面 ---- */
const own=()=>items.filter(i=>!i.wish),wish=()=>items.filter(i=>i.wish);
function card(i){return `<button class="gc" onclick="detail('${i.id}')"><div class="ph">${i.img?`<img src="${i.img}" alt="">`:ic('gift',34)}</div><b>${esc(i.name)}</b><small>${esc(i.work)||'作品名なし'}</small>${i.chara?`<span class="tag">${esc(i.chara)}</span>`:''}${i.wish?'<span class="tag">購入予定</span>':`<i class="q">×${i.qty}</i>`}</button>`}
function list(a,msg){return a.length?`<div class="grid">${a.map(card).join('')}</div>`:`<div class="empty">${msg}</div>`}
const V={
home(){const o=own(),n=o.reduce((a,i)=>a+i.qty,0),rec=[...o].sort((a,b)=>b.at-a.at).slice(0,8);
return `<h1>推しグッズ管理 ♥</h1><p class="sub">好きなものを、もっと楽しく、もっと便利に。</p>
<div class="st"><div><small>登録グッズ数</small><b>${o.length}</b><u>件</u></div><div><small>総所持数</small><b>${n}</b><u>個</u></div><div><small>購入予定</small><b>${wish().length}</b><u>件</u></div></div>
<button class="cam" onclick="check()"><i>${ic('camera',30)}</i><span><b>カメラで所持確認</b>グッズを撮影して、登録済みのコレクションから同じものを探します。</span></button>
<h2>クイックメニュー</h2><div class="qm"><button onclick="pickSheet('add')"><em>${ic('plus')}</em>グッズを登録</button><button onclick="go('col')"><em>${ic('folder')}</em>コレクション</button><button onclick="go('wish')"><em>${ic('bag')}</em>購入予定</button><button onclick="go('find')"><em>${ic('search')}</em>検索</button></div>
<h2>最近登録したグッズ</h2>${rec.length?`<div class="row">${rec.map(card).join('')}</div>`:'<div class="empty">まだグッズがありません。<br>「グッズを登録」から1つ追加してみましょう。</div>'}`},
col(){const o=own(),ws=[...new Set(o.map(i=>i.work).filter(Boolean))];
return `<h1>コレクション</h1><div class="chips"><button class="${flt?'':'on'}" onclick="setF('')">すべて</button>${ws.map(w=>`<button class="${flt===w?'on':''}" onclick="setF(this.dataset.w)" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div>${list(o.filter(i=>!flt||i.work===flt),'まだ登録がありません。')}`},
wish(){return `<div class="hdr"><h1>購入予定リスト</h1><button class="bell" onclick="pickSheet('wish')" aria-label="購入予定を追加">${ic('plus',20)}</button></div><p class="sub">欲しいグッズをチェック。買ったらタップして所持に移せます。</p><div style="height:12px"></div>${list(wish(),'購入予定はありません。<br>右上の＋から、写真を撮るか画像を選んで追加できます。')}`},
theme(){return `<button class="bk" onclick="go('me')">‹ マイページ</button><h1>テーマ</h1><p class="sub">アプリ全体の色合いを選べます。選んだら「適用」を押してください。</p><div class="swg">${T.map((t,i)=>`<button class="sw ${pend===i?'on':''}" onclick="pickT(${i})" aria-pressed="${pend===i}"><i style="background:${t.sw||pal(t,isDark()).pk};color:${t.sw==='#fff'?'#333':pal(t,isDark()).on}">${pend===i?ic('check',20):''}</i><span>${t.n}${cur===i?'<br>(使用中)':''}</span></button>`).join('')}</div><button class="pri" onclick="applyBtn()" ${pend===cur?'disabled':''}>適用</button>`},
notice(){return `<button class="bk" onclick="go('me')">‹ マイページ</button><h1>お知らせ</h1><div class="empty">お知らせはありません。<br>アプリの更新情報などが届くと、ここに表示されます。</div>`},
acc(){return `<button class="bk" onclick="openSet()">‹ 設定</button><h1>アカウント</h1><div class="rb" style="opacity:.55"><span>Googleアカウントと連携</span><small>準備中</small></div>`},
set(){const o=[['auto','端末に合わせる','スマホの設定に合わせて切り替わります。'],['light','ライトモード','明るい配色で表示します。'],['dark','ダークモード','暗い配色で表示します。']];
return `<button class="bk" onclick="go('me')">‹ マイページ</button><h1>設定</h1><button class="rb" onclick="go('acc')"><span>${ic('user',20)} アカウント</span><small>›</small></button><h2>表示モード</h2>${o.map(([k,n,d])=>`<button class="rb" onclick="pickM('${k}')" aria-pressed="${pm===k}"><span>${n}${mode===k?'(使用中)':''}<br><small>${d}</small></span><b style="color:var(--ac)">${pm===k?ic('check',20):''}</b></button>`).join('')}<p class="sub" style="margin:10px 0 0">ライトはパステル、ダークはダスティな色合いになります。白と黒のテーマは変わりません。</p><button class="pri" onclick="applyMode()" ${pm===mode?'disabled':''}>適用</button>`},
find(){return `<h1>検索</h1><input type="search" id="q" placeholder="商品名・キャラ名・作品名" oninput="doFind(this.value)"><div id="sr" style="margin-top:12px"></div>`},
me(){return `<div class="hdr"><h1>マイページ</h1><button class="bell" onclick="go('notice')" aria-label="お知らせ">${ic('bell',20)}</button></div><div class="st"><div><small>全グッズ</small><b>${items.length}</b><u>件</u></div></div><button class="rb" onclick="openTheme()"><span>${ic('palette',20)} テーマ</span><small>${T[cur].n} ›</small></button><button class="rb" onclick="openSet()"><span>${ic('gear',20)} 設定</span><small>表示モード ›</small></button><div class="empty">${db?'データはこの端末のブラウザに保存されています。':'この環境では保存できないため、閉じるとデータが消えます。'}<br>バックアップ機能は今後追加予定です。</div>`}
};
function doFind(v){v=v.trim().toLowerCase();const r=v?items.filter(i=>[i.name,i.work,i.chara,i.memo].join(' ').toLowerCase().includes(v)):[];$('#sr').innerHTML=v?list(r,'見つかりませんでした。'):''}
function setF(w){flt=w;render()}
function go(v){view=v;flt='';render();scrollTo(0,0)}
function render(){
  $('#m').innerHTML=V[view]();
  const t=[['home','home','ホーム'],['col','folder','コレクション'],['cam','camera',''],['wish','bag','購入予定'],['me','user','マイページ']];
  $('#nav').innerHTML=t.map(([k,e,l])=>k==='cam'?`<button class="fab" onclick="check()" aria-label="カメラで所持確認"><em>${ic(e,k==='cam'?26:22)}</em></button>`:`<button class="${view===k||(k==='me'&&(view==='theme'||view==='set'||view==='acc'||view==='notice'))?'on':''}" onclick="go('${k}')"><em>${ic(e,k==='cam'?26:22)}</em>${l}</button>`).join('');
}

/* ---- シート ---- */
function sheet(h){const S=$('#S');S.innerHTML=`<div class="sh"><div class="hd"><button onclick="closeS()" aria-label="閉じる">${ic('x',16)}</button></div>${h}</div>`;S.className='on'}
function closeS(){$('#S').className='';armed=false}
/* ---- 画像選択 → 確認画面 ---- */
let rmode='check',kw='';
const PT={check:['カメラで所持確認','登録済みのグッズから、同じものを探します。'],add:['グッズを登録','まず、登録済みに同じものがないか確認します。'],wish:['購入予定を追加','まず、すでに持っていないか確認します。']};
function pickSheet(m){rmode=m;sheet(`<h2 style="margin-top:0">${PT[m][0]}</h2><p class="sub">${PT[m][1]}</p>${camBtn()}<label class="btn ghost">${ic('image',18)} 画像を選ぶ<input type="file" accept="image/*" hidden onchange="picked(this.files[0])"></label>${camBlocked?NOTE:''}`)}
function check(){pickSheet('check')}

const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[!?！？「」『』()（）\[\]【】\-_~〜]+/g,'');
function grams(s,uni){const g=new Set();String(s||'').split(/[\s\u3000、。,.・\/|]+/).forEach(w=>{const t=norm(w);if(t.length===1)g.add(t);for(let i=0;i<t.length-1;i++)g.add(t.slice(i,i+2));if(uni)for(const c of t)g.add(c)});return g}
function kwScore(q,i){const Q=grams(q);if(!Q.size)return 0;const D=grams([i.name,i.work,i.chara,i.memo,i.genre].join('|'),1);let m=0;Q.forEach(x=>{if(D.has(x))m++});return m/Q.size}
function cands(){const q=kw.trim();return items.map(i=>{const si=i.feat?sim(tmp.feat,i.feat):0,sk=q?kwScore(q,i):0;const gw=tmp.genre&&i.genre?(i.genre===tmp.genre?1.15:.7):1;return{i,sk,s:Math.min(1,(q?(i.feat?.35*si+.65*sk:sk):si)*gw)}}).filter(x=>q?x.sk>0:x.i.feat).sort((a,b)=>b.s-a.s).slice(0,5)}
function candHTML(r){return r.length?r.map(x=>`<button class="hit" onclick="detail('${x.i.id}',1)">${x.i.img?`<img src="${x.i.img}" alt="">`:`<div class="ph">${ic('gift',22)}</div>`}<div><b>${esc(x.i.name)}</b><small class="sub">${esc(x.i.work)||'作品名なし'} ・ ${x.i.wish?'購入予定':'所持 ×'+x.i.qty}</small></div><span>${Math.round(x.s*100)}%</span></button>`).join(''):`<div class="empty" style="margin-top:8px">${items.length?'候補が見つかりません。キーワードを変えてみてください。':'登録済みのグッズがまだありません。'}</div>`}

function review(){const T2={check:'同じものがあるか確認',add:'登録済みに同じものがないか確認',wish:'すでに持っていないか確認'}[rmode];
  const go2={check:['見つからない → この写真で新規登録','add(true)'],add:['同じものはない → この画像で登録に進む','add(true)'],wish:['持っていない → 購入予定の登録に進む','add(true,true)']}[rmode];
  sheet(`<h2 style="margin-top:0">${T2}</h2><img class="pv" src="${tmp.img}" alt="選んだ画像">${tmp.genre?`<p class="sub" style="margin-top:8px">種類:${esc(tmp.genre)}(同じ種類のグッズを優先して探します)</p>`:''}${tmp.text?'<p class="sub" style="margin-top:8px">詳細モード:シールや説明文を見ながら、下のキーワード欄に入力して探せます。文字の自動読み取りは今後追加予定です。</p>':''}<h2>似ている候補</h2><p class="sub">タップすると詳細が開きます。同じものがあるか確認してください。</p><div id="cl">${candHTML(cands())}</div><h2>キーワードでさらに探す</h2><p class="sub">グッズ名・作品名・キャラ名・説明など、分かることを入れてください。詳しく入れるほど、合うものが上に出ます。</p><input type="search" id="kw" value="${esc(kw)}" placeholder="例:星のしずく ユキ ぬいぐるみ" oninput="kwIn(this.value)"><button class="pri ghost" onclick="${go2[1]}">${go2[0]}</button>`)}

  ${i.wish?`<button class="pri" onclick="own1('${i.id}')">買った!所持に移す</button>`:`<div class="qt"><button onclick="qty('${i.id}',-1)" aria-label="減らす">−</button><b style="font-size:22px" id="qn">×${i.qty}</b><button onclick="qty('${i.id}',1)" aria-label="増やす">＋</button></div>`}
  <button class="pri danger" id="dl" onclick="rm('${i.id}')">削除する</button>`)}
