<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let db=null,items=[],view='home',flt='',tmp=null,armed=false;

/* ---- 保存(IndexedDB) ---- */
function openDB(){return new Promise((ok,ng)=>{try{const r=indexedDB.open('oshi',1);r.onupgradeneeded=()=>r.result.createObjectStore('g',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>ng(r.error)}catch(e){ng(e)}})}
function put(i){try{db&&db.transaction('g','readwrite').objectStore('g').put(i)}catch(e){}}
function del(id){try{db&&db.transaction('g','readwrite').objectStore('g').delete(id)}catch(e){}}
function loadAll(){return new Promise(ok=>{try{const r=db.transaction('g').objectStore('g').getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>ok([])}catch(e){ok([])}})}

/* ---- 画像処理と簡易マッチング ---- */
async function proc(file){
  const url=URL.createObjectURL(file);
  const im=await new Promise((ok,ng)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ng;i.src=url});
  const W=im.naturalWidth,H=im.naturalHeight,s=Math.min(W,H);
  const c=document.createElement('canvas');c.width=c.height=360;
  c.getContext('2d').drawImage(im,(W-s)/2,(H-s)/2,s,s,0,0,360,360);
  URL.revokeObjectURL(url);
  const f=document.createElement('canvas');f.width=f.height=16;
  const x=f.getContext('2d');x.drawImage(c,0,0,16,16);
  const d=x.getImageData(0,0,16,16).data,g=[],h=new Array(64).fill(0);
  for(let i=0;i<d.length;i+=4){g.push(.3*d[i]+.59*d[i+1]+.11*d[i+2]);h[(d[i]>>6)*16+(d[i+1]>>6)*4+(d[i+2]>>6)]++}
  const mean=g.reduce((a,b)=>a+b)/g.length,sd=Math.sqrt(g.reduce((a,b)=>a+(b-mean)**2,0)/g.length)||1;
  return{img:c.toDataURL('image/jpeg',.8),feat:{g:g.map(v=>(v-mean)/sd),h:h.map(v=>v/256)}};
}
function sim(a,b){let dot=0,hi=0;for(let i=0;i<256;i++)dot+=a.g[i]*b.g[i];for(let i=0;i<64;i++)hi+=Math.min(a.h[i],b.h[i]);return .4*Math.max(0,dot/256)+.6*hi}

/* ---- 画面 ---- */
/* ---- フォルダ・ゴミ箱 ---- */
let folders=[],cf=null,selMode=false,sel=new Set(),lpT=0,lpF=0,lpX=0,lpY=0,fdIds=[],fdTitle='',fdNote='',fdReg=false,dlgOk=null;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const SYS=[['f-work','作品別'],['f-chara','キャラクター別'],['f-genre','グッズの種類別'],['f-period','発売時期別']];
function loadF(){let a=[];try{a=JSON.parse(localStorage.getItem('oshi-folders')||'[]')}catch(e){}
  folders=[...SYS.filter(([id])=>!a.some(f=>f.id===id)).map(([id,n],k)=>({id,name:n,parent:null,at:k})),...a]}
function saveF(){try{localStorage.setItem('oshi-folders',JSON.stringify(folders))}catch(e){}}
const live=()=>items.filter(i=>!i.del);
const own=()=>live().filter(i=>!i.wish),wish=()=>live().filter(i=>i.wish);
const kids=p=>folders.filter(f=>f.parent===p),fById=id=>folders.find(f=>f.id===id),inF=(i,id)=>(i.folders||[]).includes(id);
function desc(id){const r=[id];kids(id).forEach(k=>r.push(...desc(k.id)));return r}
function fCount(id){const d=new Set(desc(id));return live().filter(i=>(i.folders||[]).some(x=>d.has(x))).length}
function flat(p=null,d=0){return kids(p).flatMap(f=>[{f,d},...flat(f.id,d+1)])}
function crumb(id){const r=[];let f=fById(id);while(f){r.unshift(f.name);f=fById(f.parent)}return r.join(' › ')}
function ensureF(name,parent){let f=folders.find(x=>x.parent===parent&&x.name===name);if(!f){f={id:uid(),name,parent,at:Date.now()};folders.push(f)}return f.id}
function autoSort(list){const b=folders.length;let n=0;
  list.forEach(i=>{const add=[];
    if(i.work)add.push(ensureF(i.work,'f-work'));
    (i.chara||'').split(/[、,，\/／・\n]+/).map(x=>x.trim()).filter(Boolean).forEach(c=>add.push(ensureF(c,'f-chara')));
    if(i.genre)add.push(ensureF(i.genre,'f-genre'));
    const y=(i.period||'').normalize('NFKC').match(/(\d{4})\s*年?/);if(y)add.push(ensureF(y[1]+'年','f-period'));
    if(add.length){i.folders=[...new Set([...(i.folders||[]),...add])];put(i);n++}});
  saveF();return{n,nf:folders.length-b}}
const isUT=n=>/^タイトル無し\d+$/.test(n)||n==='(名前なし)';
function nextUntitled(ex){const u=new Set(live().filter(x=>x.id!==ex).map(x=>(String(x.name).match(/^タイトル無し(\d+)$/)||[])[1]).filter(Boolean).map(Number));let n=1;while(u.has(n))n++;return 'タイトル無し'+n}
const itemsGrid=(a,m)=>a.length?`<div class="grid">${a.map(i=>card(i,1)).join('')}</div>`:`<div class="empty">${m}</div>`;
const curItems=()=>cf==='all'?live():cf==='unsorted'?live().filter(i=>!(i.folders||[]).length):cf?live().filter(i=>inF(i,cf)):[];
function openF(id){cf=id;selMode=false;sel.clear();render();scrollTo(0,0)}
function backF(){const f=fById(cf);cf=(cf==='all'||cf==='unsorted'||!f)?null:f.parent;selMode=false;sel.clear();render();scrollTo(0,0)}
function cardTap(id){if(lpF){lpF=0;return}if(selMode){sel.has(id)?sel.delete(id):sel.add(id);if(!sel.size)selMode=false;render()}else detail(id)}
function selOff(){selMode=false;sel.clear();render()}
function selAll(){curItems().forEach(i=>sel.add(i.id));render()}

const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/[!?！？「」『』()（）\[\]【】\-_~〜]+/g,'');
function grams(s,uni){const g=new Set();String(s||'').split(/[\s\u3000、。,.・\/|]+/).forEach(w=>{const t=norm(w);if(t.length===1)g.add(t);for(let i=0;i<t.length-1;i++)g.add(t.slice(i,i+2));if(uni)for(const c of t)g.add(c)});return g}

function tabsHTML(){return `<button class="${gtab==='rec'?'on':''}" onclick="cTab('rec')">最近使った</button><button class="${gtab==='all'?'on':''}" onclick="cTab('all')">すべて</button>`}
function cTab(t){gtab=t;gscr=0;const e=$('#gt');if(e)e.innerHTML=tabsHTML();genList();const L=$('#gl');if(L)L.scrollTop=0}
function cFind(v){cq=v;if(v.trim()&&gtab!=='all'){gtab='all';const e=$('#gt');if(e)e.innerHTML=tabsHTML()}gscr=0;genList();const L=$('#gl');if(L)L.scrollTop=0}
function genList(keep){const L=$('#gl');if(!L)return;const y=L.scrollTop,t=HIRA(cq).split(/\s+/).filter(Boolean);
  let ix=gtab==='rec'?getRec().map(n=>GEN.findIndex(g=>g[0]===n)).filter(i=>i>=0):GEN.map((g,i)=>i);
  if(t.length)ix=ix.filter(i=>{const h=HIRA(GEN[i][0]+' '+GEN[i][4]),h2=h.replace(/\s/g,'');return t.every(w=>h.includes(w)||h2.includes(w))});
  const row=i=>{const g=GEN[i];return `<button class="gr ${cpg===i?'on':''}" onclick="cGen(${i})"><b>${esc(g[0])}</b><small>${gsz(g)}</small></button>`};
  L.innerHTML=ix.length?ix.map(row).join(''):(gtab==='rec'&&!t.length?'<p class="chint">まだ使った種類がありません。「すべて」から選んで適用すると、ここに出ます。</p>':'<p class="chint">該当する種類がありません。別の言葉でも探してみてください。</p>');
  if(keep)L.scrollTop=y}
function cApply(){cm=cpm;cg=cm==='kind'?cpg:-1;if(cg>=0){try{localStorage.setItem('oshi-recent',JSON.stringify([GEN[cg][0],...getRec().filter(n=>n!==GEN[cg][0])].slice(0,10)))}catch(e){}}cpm='';camBar();frame()}
function camBar(){const sum=cm==='kind'&&cg>=0?GEN[cg][0]:cm==='text'?'詳細(文字)':'指定なし';
  let h=`<div class="seg"><button class="${cpm==='kind'?'on':''}" onclick="cSel('kind')">種類を選んで枠で撮る</button><button class="${cpm==='text'?'on':''}" onclick="cSel('text')">詳細(文字)で探す</button></div>`;
  if(cpm==='kind')h+=`<input type="search" id="gq" class="gq" value="${esc(cq)}" placeholder="種類を検索(例:缶バッジ 44、あくすた)" oninput="cFind(this.value)" autocomplete="off"><div class="gch">${CH.map((w,i)=>`<button onclick="cChip(${i})">${w}</button>`).join('')}</div><div class="gt" id="gt">${tabsHTML()}</div><div id="gl" class="gl" onscroll="gscr=this.scrollTop"></div>`;
  else if(cpm==='text')h+='<p class="chint">シールや説明文が写るように撮影します。</p>';
  if(cpm)h+=`<button class="pri" id="ap" style="margin-top:8px" onclick="cApply()" ${cpm==='kind'&&cpg<0?'disabled':''}>適用</button><button class="lnk" onclick="cClear()">指定なしで普通に撮る</button>`;
  else{if(cm==='kind'&&cg>=0)h+=`<p class="cn">${GEN[cg][6]?'枠なしの種類です。点線の範囲に全体がしっかり入るように、正面から撮影してください。':'しっかり枠に合わせて、正面から撮影してください。(正面以外だと精度が下がります)'}<br>開発中の機能のため、合う枠が見つからない場合や使いにくい場合は、「指定なし」で普通に撮るか、「詳細(文字)」で探すのがおすすめです。</p>`;
    h+=`<div class="shr"><span class="sum">${esc(sum)}</span><button class="shut" onclick="shoot()" aria-label="撮影"></button><span></span></div>`}
  $('#cb').innerHTML=h;if(cpm==='kind')genList();vvFix();if(cpm==='kind'){const L=$('#gl');if(L)L.scrollTop=gscr}}
function vvFix(){const c=$('#cam');if(!c)return;const h=window.visualViewport?visualViewport.height:innerHeight;c.style.height=h+'px';const L=$('#gl');if(L)L.style.maxHeight=Math.max(96,Math.round(h*.24))+'px';frame()}
function frame(){const f=$('#fr'),c=$('#fcap'),R=$('#cam');if(!f||!R)return;const r=R.getBoundingClientRect(),b=$('#cb'),bh=b?b.offsetHeight:0,av=r.height-bh,cy=Math.max(r.height*.3,av/2);
  if(cm!=='kind'||cg<0){f.style.display='none';c.textContent=cm==='text'?'文字が読める距離で撮影してください':'';c.style.top=cy+'px';return}
  const[n,w,h,ci,,ap,fr0]=GEN[cg];let k;
  if(fr0)k=Math.min(r.width*.88/w,av*.78/h);
  else{const L=Math.max(w,h),fr=Math.min(.78,.3+.48*Math.log(L/20)/Math.log(1030/20));k=Math.min(r.width*.9/w,av*.8/h)*(fr/.78)}
  const fw=w*k,fh=h*k;
  Object.assign(f.style,{display:'block',top:cy+'px',width:fw+'px',height:fh+'px',borderRadius:ci?'50%':'8px',borderStyle:fr0?'dashed':'solid'});
  c.textContent=fr0?n+':枠なし。点線の範囲に全体が入るように撮影':n+'('+(ci?'直径'+w:w+'×'+h)+'mm'+(ap?'・目安':'')+')の線に合わせて撮影';c.style.top=(cy+fh/2+10)+'px'}
function shoot(){const v=$('#cv');if(!v||!v.videoWidth)return;
  const vw=v.videoWidth,vh=v.videoHeight,R=$('#cam').getBoundingClientRect();let sx=0,sy=0,sw=vw,sh=vh;
  if(cm==='kind'&&cg>=0){const r=$('#fr').getBoundingClientRect(),sc=Math.max(R.width/vw,R.height/vh),ox=(vw*sc-R.width)/2,oy=(vh*sc-R.height)/2,m=1.08,cx=r.left-R.left+r.width/2,cy=r.top-R.top+r.height/2;
    sw=r.width*m/sc;sh=r.height*m/sc;sx=Math.max(0,(cx+ox)/sc-sw/2);sy=Math.max(0,(cy+oy)/sc-sh/2);sw=Math.min(sw,vw-sx);sh=Math.min(sh,vh-sy)}
  const c=document.createElement('canvas');c.width=sw;c.height=sh;c.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,sw,sh);
  const meta={genre:cm==='kind'&&cg>=0?GEN[cg][0]:'',text:cm==='text'};
  c.toBlob(b=>{if(!b)return;closeCam();picked(new File([b],'cam.jpg',{type:'image/jpeg'}),meta)},'image/jpeg',.9)}
addEventListener('keydown',e=>{if($('#cam')&&(e.key==='AudioVolumeDown'||e.code==='AudioVolumeDown')){e.preventDefault();shoot()}});
